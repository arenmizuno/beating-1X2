name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite is deliberately hermetic -- it runs entirely on synthetic
        # frames from tests/conftest.py and never touches the network. CI
        # verifies logic, not the availability of three third-party data
        # sources, so a football-data.co.uk outage can never turn the build red.
        run: pytest

      - name: Verify the leakage guard actually fails on leaky features
        # A guard that never fires on a broken build is worse than no guard, so
        # CI mutates shift(1) -> shift(0) (making each match visible to itself)
        # and asserts the suite goes red. If this step SUCCEEDS in keeping the
        # tests green, the leakage protection has silently stopped working.
        run: |
          cp src/features.py /tmp/features_backup.py
          sed -i 's/grouped\[stat\]\.shift(1)/grouped[stat].shift(0)/' src/features.py
          if pytest tests/test_features.py -q > /dev/null 2>&1; then
            cp /tmp/features_backup.py src/features.py
            echo "::error::Leakage mutation did NOT fail the tests -- the guard is broken."
            exit 1
          fi
          cp /tmp/features_backup.py src/features.py
          echo "Leakage guard verified: injected leakage fails the suite."
